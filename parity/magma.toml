# Magma parity matrix: which parts of Magma Calyx covers, chapter by chapter.
#
# This file is the source of truth. After editing it, run
#
#     python3 parity/generate.py
#
# to regenerate parity/README.md, the charts and the summary in README.md.
# CI runs `python3 parity/generate.py --check`, which fails if they are stale
# or if a path listed under `calyx` does not exist under src/.
#
# Fields of a chapter:
#   part, title, slug  the Handbook part, the chapter, and its page
#                      (https://magma.maths.usyd.edu.au/magma/handbook/<slug>)
#   intrinsics         number of distinct intrinsics the chapter documents
#   status             available | partial | missing | n/a | unassessed
#   summary            what the chapter covers, in our own words
#   calyx              where the functionality lives in Calyx (dotted paths under src/)
#   origin             sage | calyx | both: where that functionality comes from
#   crosschecked       true if Calyx results are compared against Magma in a test harness
#   notes              what is missing or different
#   issues             related issue numbers on aygerix/calyx-math

[handbook]
version = "V2.29"
date = "2026-08-03"

